name: gitea-schema-check

on:
  push:
    paths:
      - 'dashboard/**'
      - 'schemas/**'
      - '.gitea/workflows/**'
  pull_request:
    paths:
      - 'dashboard/**'
      - 'schemas/**'
      - '.gitea/workflows/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: dappgo-linux-host
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON schemas
        run: |
          set -Eeuo pipefail
          venv="$HOME/a001/tools/report-schema-venv"
          if [ ! -x "$venv/bin/python" ]; then
            python3 -m venv "$venv"
            "$venv/bin/pip" install --disable-pip-version-check --quiet 'jsonschema>=4.20,<5'
          fi
          "$venv/bin/python" - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          from pathlib import Path

          root = Path.cwd()
          data_path = root / "dashboard/data.json"
          if data_path.exists():
              schema = json.loads((root / "schemas/data.schema.json").read_text())
              data = json.loads(data_path.read_text())
              errors = list(Draft202012Validator(schema).iter_errors(data))
              if errors:
                  raise SystemExit("; ".join(error.message for error in errors[:20]))
              print("ok: dashboard/data.json")
          else:
              print("skip: dashboard/data.json")

          fixture_path = root / "tests/fixtures/rss-media-news.json"
          fixture = json.loads(fixture_path.read_text())
          errors = list(Draft202012Validator(schema).iter_errors(fixture))
          if errors:
              raise SystemExit("rss:media fixture failed: " + "; ".join(error.message for error in errors[:20]))
          print("ok: rss:media fixture")

          invalid = json.loads((root / "tests/fixtures/rss-media-news-invalid-source.json").read_text())
          if not list(Draft202012Validator(schema).iter_errors(invalid)):
              raise SystemExit("unsupported image source was accepted")
          print("ok: unsupported image source rejected")

          report_schema = json.loads((root / "schema/v1.json").read_text())
          report_fixture = json.loads((root / "tests/fixtures/rss-media-report-v1.json").read_text())
          errors = list(Draft202012Validator(report_schema).iter_errors(report_fixture))
          if errors:
              raise SystemExit("rss:media report fixture failed: " + "; ".join(error.message for error in errors[:20]))
          print("ok: rss:media report fixture")

          invalid_report = json.loads((root / "tests/fixtures/rss-media-report-v1-invalid-source.json").read_text())
          if not list(Draft202012Validator(report_schema).iter_errors(invalid_report)):
              raise SystemExit("unsupported report image source was accepted")
          print("ok: unsupported report image source rejected")
          PY
