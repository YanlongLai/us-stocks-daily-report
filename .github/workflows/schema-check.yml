name: Schema Check

on:
  push:
    paths:
      - 'dashboard/data.json'
      - 'schemas/*.schema.json'
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ajv-cli
        run: npm install -g ajv-cli ajv-formats
      - name: Validate data.json
        run: |
          if [ -f dashboard/data.json ]; then
            ajv validate \
              --spec=draft2020 \
              --strict=false \
              -s schemas/data.schema.json \
              -d dashboard/data.json \
              --all-errors --verbose
          else
            echo "dashboard/data.json missing — skip"
          fi
          ajv validate \
            --spec=draft2020 \
            --strict=false \
            -s schemas/data.schema.json \
            -d tests/fixtures/rss-media-news.json \
            --all-errors --verbose
          if ajv validate \
            --spec=draft2020 \
            --strict=false \
            -s schemas/data.schema.json \
            -d tests/fixtures/rss-media-news-invalid-source.json \
            --all-errors --verbose; then
            echo "unsupported image source was accepted"
            exit 1
          else
            echo "ok: unsupported image source rejected"
          fi
          ajv validate \
            --spec=draft2020 \
            --strict=false \
            -s schema/v1.json \
            -d tests/fixtures/rss-media-report-v1.json \
            --all-errors --verbose
          if ajv validate \
            --spec=draft2020 \
            --strict=false \
            -s schema/v1.json \
            -d tests/fixtures/rss-media-report-v1-invalid-source.json \
            --all-errors --verbose; then
            echo "unsupported report image source was accepted"
            exit 1
          else
            echo "ok: unsupported report image source rejected"
          fi
